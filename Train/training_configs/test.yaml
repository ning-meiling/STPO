# =========================
# Model arguments
# =========================
model_name_or_path: alignment-handbook/zephyr-7b-sft-qlora
torch_dtype: null
attn_implementation: eager


# =========================
# Data training arguments
# =========================
dataset_mixer:
  HuggingFaceH4/ultrafeedback_binarized: 1.0

# ⚠️ 必须同时包含 train + test（脚本假设）
dataset_splits:
- train_prefs
- test_prefs

preprocessing_num_workers: 2


# =========================
# SimPOTrainer / Training arguments
# =========================
bf16: true

beta: 2.0
gamma_beta_ratio: 0.8

num_train_epochs: 1
max_steps: 200          # ⭐ 控制只跑 ~10 条数据

per_device_train_batch_size: 1
gradient_accumulation_steps: 1
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

learning_rate: 3.0e-7
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_bnb_8bit

max_length: 512
max_prompt_length: 256

logging_steps: 10
log_level: info

# 不实际做 eval，但 test split 必须存在
do_eval: false

save_strategy: "no"
report_to: none

output_dir: outputs/debug-simpo
run_name: debug-simpo
seed: 42
push_to_hub: false
